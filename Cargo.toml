[package]
name = "shop"
version = "0.1.0"
edition = "2021"

[dependencies]
parquet = { version = "=60.1.0", default-features = false }
rayon = "=1.12.0"
memchr = "=2.8.3"
libc = "0.2"
rustc-hash = "=2.1.3"
bytes = "=1.12.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false


[profile.prof]
inherits = "release"
debug = true
